[project]
name = "agent-lab-api"
version = "0.1.0"
description = "FastAPI backend for Agent-Lab (practice copy of the agent framework)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Web framework + server
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  # Settings + validation
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  # Database: async SQLAlchemy on PostgreSQL, Alembic migrations
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "greenlet>=3.0.0",
  "alembic>=1.13.0",
  # LLM: Azure OpenAI (v1 API) through the official client
  "openai>=1.40.0",
  "httpx>=0.28.1",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "reportlab>=5.1.0",
  "azure-identity>=1.27.0",
  "azure-storage-blob>=12.31.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
