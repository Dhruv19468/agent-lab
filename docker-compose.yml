services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_lab-postgres
    environment:
      POSTGRES_DB: agent_lab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agent_lab_db']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: agent-lab-api
    container_name: agent_lab-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Inside Compose the database is the `postgres` service on its internal port 5432.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/agent_lab_db
      RUN_ALEMBIC_ON_STARTUP: 'true'
      # The repo's data/ folder is mounted at /data (on Azure: the Azure Files share)
      AGENT_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: agent-lab-web
    container_name: agent_lab-frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:80'

volumes:
  postgres-data:
